[package]
name = "wasip2-sandbox-host"
version = "0.1.0"
edition = "2021"
description = "Wasmtime host with capability-based sandbox for WASI P2 components"
license = "Apache-2.0"

[dependencies]
wasmtime = { version = "29", features = ["component-model"] }
wasmtime-wasi = "29"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "wasip2-host"
path = "src/main.rs"
